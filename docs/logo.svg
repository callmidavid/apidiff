<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="#1E293B"/>

  <!-- Left { - Old API - Blue -->
  <text x="48" y="265" font-family="Inter, system-ui, sans-serif" font-size="230" font-weight="600" fill="#3B82F6">{</text>

  <!-- Diff slash / - Blue to Green -->
  <defs>
    <linearGradient id="diffGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>
  <text x="160" y="265" font-family="Inter, system-ui, sans-serif" font-size="230" font-weight="600" fill="url(#diffGrad)">/</text>

  <!-- Right } - New API - Green -->
  <text x="235" y="265" font-family="Inter, system-ui, sans-serif" font-size="230" font-weight="600" fill="#4ADE80">}</text>

  <!-- Removed - Red -->
  <rect x="118" y="182" width="42" height="13" rx="6" fill="#EF4444"/>

  <!-- Added + Green -->
  <g fill="#4ADE80">
    <rect x="228" y="168" width="42" height="13" rx="4"/>
    <rect x="241" y="155" width="13" height="42" rx="4"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="355" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="600" fill="#FFFFFF" letter-spacing="1">Apidiff</text>
</svg>